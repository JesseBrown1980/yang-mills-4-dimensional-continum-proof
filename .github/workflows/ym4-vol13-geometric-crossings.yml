name: YM4 VOL13 geometric crossings and reflection-compatible blocking
on:
  pull_request:
    paths:
      - 'tests/ym4_su2_vol13_geometric_crossings.py'
      - 'docs/certificate-atlas/*VOL13*'
      - '.github/workflows/ym4-vol13-geometric-crossings.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Exact geometry and fixture replay
        run: |
          set -euo pipefail
          mkdir -p build/ym4-vol13
          python3 -I -B tests/ym4_su2_vol13_geometric_crossings.py > build/ym4-vol13/VOL13.hbp
          python3 -O -I -B tests/ym4_su2_vol13_geometric_crossings.py > build/ym4-vol13/REPLAY.hbp
          cmp build/ym4-vol13/VOL13.hbp build/ym4-vol13/REPLAY.hbp
          cmp build/ym4-vol13/VOL13.hbp docs/certificate-atlas/YM4-VOL13-GEOMETRIC-CROSSINGS-20261124.hbp
          cat build/ym4-vol13/VOL13.hbp
      - name: No-float gate
        run: python3 -I -B scripts/no_float_gate.py .
