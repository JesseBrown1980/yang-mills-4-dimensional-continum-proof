name: YM4 VOL14D3A covariant crossing-face lift
on:
  pull_request:
    paths:
      - 'tests/ym4_vol14d3a_covariant_face.py'
      - 'docs/certificate-atlas/*VOL14D3A*'
      - '.github/workflows/ym4-vol14d3a-covariant-face.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-replay:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Exact suffix swaps and right inverse witnesses
        run: |
          set -euo pipefail
          mkdir -p build/ym4-vol14d3a
          python3 -I -B tests/ym4_vol14d3a_covariant_face.py > build/ym4-vol14d3a/receipt.hbp
          python3 -O -I -B tests/ym4_vol14d3a_covariant_face.py > build/ym4-vol14d3a/replay.hbp
          cmp build/ym4-vol14d3a/receipt.hbp build/ym4-vol14d3a/replay.hbp
          cmp build/ym4-vol14d3a/receipt.hbp docs/certificate-atlas/YM4-VOL14D3A-COVARIANT-FACE-20261126.hbp
          cat build/ym4-vol14d3a/receipt.hbp
      - name: No-float gate
        run: python3 -I -B scripts/no_float_gate.py .
