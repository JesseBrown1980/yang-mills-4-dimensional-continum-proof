name: Exact 4D SU2 finite-lattice lemma

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  exact-lemma:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Exact quaternion gauge covariance and negative controls
        run: python3 -I tests/test_exact_su2_4d.py
