name: YM4 VOL12 independent external FoldMix source attestation
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/ym4-vol12-external-chessboard-attest.yml'
  push:
    paths:
      - '.github/workflows/ym4-vol12-external-chessboard-attest.yml'
permissions:
  contents: read
jobs:
  attest-external-lean-source-without-execution:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Retrieve SHA-pinned upstream archive and examine source only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/ym4-vol12-upstream
          SOURCE='https://computoergosum.com/en/principia/lean/principia-ym-three-volumes-2026-11-13.tar.gz'
          ARCHIVE=build/ym4-vol12-upstream/upstream.tar.gz
          curl --fail --location --retry 3 --max-time 150 --silent --show-error "$SOURCE" -o "$ARCHIVE"
          echo 'f8a444517b2f013a287ec20075977cb0afa71c019de2d3c3da577118c05aea62  build/ym4-vol12-upstream/upstream.tar.gz' | sha256sum -c
          tar -tzf "$ARCHIVE" > build/ym4-vol12-upstream/ARCHIVE-FILES.txt
          grep -E '(FoldMix|FoldWilson|FoldCap|FoldEntropy|TorusRP).*\.lean$' build/ym4-vol12-upstream/ARCHIVE-FILES.txt | tee build/ym4-vol12-upstream/RELATED-FILES.txt
          test -s build/ym4-vol12-upstream/RELATED-FILES.txt
          : > build/ym4-vol12-upstream/DECLARATIONS.txt
          while IFS= read -r path; do
            echo "FILE: $path" >> build/ym4-vol12-upstream/DECLARATIONS.txt
            tar -xOf "$ARCHIVE" "$path" | grep -n -E 'rarity_orient|rarity_uniform_all_mix|wilson_chessboard_even|bigP|ballQ|q_lt_one|def.*[Zz]w|[Ss]orry|native_decide' >> build/ym4-vol12-upstream/DECLARATIONS.txt || true
          done < build/ym4-vol12-upstream/RELATED-FILES.txt
          echo '=== SOURCE DECLARATIONS AND SCOPE ==='
          cat build/ym4-vol12-upstream/DECLARATIONS.txt
          grep -Fq 'rarity_orient' build/ym4-vol12-upstream/DECLARATIONS.txt
          # Never execute the untrusted external proof code in this job.
          echo 'YM4_VOL12_EXTERNAL|SHA256=PASS|source_listing=PASS|rarity_orient_located=YES|lean_compilation=NOT_PERFORMED|source_scope_review=REQUIRED|json=0'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ym4-vol12-upstream-attestation-metadata
          path: |
            build/ym4-vol12-upstream/ARCHIVE-FILES.txt
            build/ym4-vol12-upstream/RELATED-FILES.txt
            build/ym4-vol12-upstream/DECLARATIONS.txt
          retention-days: 30
          if-no-files-found: warn
