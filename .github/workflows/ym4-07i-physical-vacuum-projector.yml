name: YM4-07I original SU2 physical vacuum projector and Wilson correlation

on:
  push:
    paths:
      - 'docs/PREDICT-YM4-07I-FINITE-4D-SU2-VACUUM-PROJECTOR-20261121.hbp'
      - 'docs/NOTE-YM4-07I-FINITE-4D-SU2-PHYSICAL-VACUUM-PROJECTOR-20261121.md'
      - 'tests/test_ym4_07i_physical_vacuum_projector.py'
      - '.github/workflows/ym4-07i-physical-vacuum-projector.yml'
  pull_request:
    paths:
      - 'docs/PREDICT-YM4-07I-FINITE-4D-SU2-VACUUM-PROJECTOR-20261121.hbp'
      - 'docs/NOTE-YM4-07I-FINITE-4D-SU2-PHYSICAL-VACUUM-PROJECTOR-20261121.md'
      - 'tests/test_ym4_07i_physical_vacuum_projector.py'
      - '.github/workflows/ym4-07i-physical-vacuum-projector.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-physical-vacuum-projector:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify frozen independent vacuum-projector targets
        run: |
          set -euo pipefail
          test "$(git hash-object docs/PREDICT-YM4-07I-FINITE-4D-SU2-VACUUM-PROJECTOR-20261121.hbp)" = 'c46a3bd8d454faacc00a9652d61e87c4a18f6e5d'
          grep -Fq '|phase=BEFORE_CHECKER|' docs/PREDICT-YM4-07I-FINITE-4D-SU2-VACUUM-PROJECTOR-20261121.hbp
          grep -Fq '|continuum_mass_gap=OPEN|' docs/PREDICT-YM4-07I-FINITE-4D-SU2-VACUUM-PROJECTOR-20261121.hbp
      - name: No-float source gate
        run: |
          set -euo pipefail
          python3 -I -X utf8 scripts/no_float_gate.py --selftest
          python3 -I -X utf8 scripts/no_float_gate.py .
      - name: Exact original 4D SU2 huge-integer physical projector inequalities
        run: |
          set -euo pipefail
          mkdir -p build/ym4_07i
          python3 -I -B -X utf8 tests/test_ym4_07i_physical_vacuum_projector.py | tee build/ym4_07i/EXACT-4D-PHYSICAL-VACUUM-PROJECTOR.hbp
          grep -Fq '|N=59049|delta_over_gap_lt=1_OVER_1000000|gate=HOLD|' build/ym4_07i/EXACT-4D-PHYSICAL-VACUUM-PROJECTOR.hbp
          grep -Fq '|N=177147|delta_over_gap_lt=1_OVER_1000000|gate=PASS|' build/ym4_07i/EXACT-4D-PHYSICAL-VACUUM-PROJECTOR.hbp
          grep -Fq '|norm_Pi_MINUS_PiN_lt=1_OVER_500000|' build/ym4_07i/EXACT-4D-PHYSICAL-VACUUM-PROJECTOR.hbp
          grep -Fq '|four_step_W_T4_W_error_lt=1_OVER_125000|' build/ym4_07i/EXACT-4D-PHYSICAL-VACUUM-PROJECTOR.hbp
          grep -Fq '|false_claims=10_REJECTED|' build/ym4_07i/EXACT-4D-PHYSICAL-VACUUM-PROJECTOR.hbp
          grep -Fq '|continuum_mass_gap=OPEN|' build/ym4_07i/EXACT-4D-PHYSICAL-VACUUM-PROJECTOR.hbp
      - name: Optimized receipt byte equality
        run: |
          set -euo pipefail
          python3 -O -I -B -X utf8 tests/test_ym4_07i_physical_vacuum_projector.py > build/ym4_07i/OPTIMIZED.hbp
          cmp build/ym4_07i/EXACT-4D-PHYSICAL-VACUUM-PROJECTOR.hbp build/ym4_07i/OPTIMIZED.hbp
          sha256sum build/ym4_07i/EXACT-4D-PHYSICAL-VACUUM-PROJECTOR.hbp > build/ym4_07i/RECEIPT.sha256
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ym4-07i-original-SU2-physical-vacuum-projector
          path: build/ym4_07i/
          if-no-files-found: warn
