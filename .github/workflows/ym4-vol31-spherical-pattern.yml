name: YM4 VOL31 exact 4D 24-cell spherical pattern certificate
on:
  push:
    branches:
      - research/ym4-vol12-finite-packet-pilot-20261123
    paths:
      - tests/ym4_vol31_pattern_verify.py
      - docs/certificate-atlas/YM4-VOL31-SPHERICAL-PATTERN-20261123.hbp
      - .github/workflows/ym4-vol31-spherical-pattern.yml
  pull_request:
    paths:
      - tests/ym4_vol31_pattern_verify.py
      - docs/certificate-atlas/YM4-VOL31-SPHERICAL-PATTERN-20261123.hbp
      - .github/workflows/ym4-vol31-spherical-pattern.yml
  workflow_dispatch:

jobs:
  exact-24-cell-pattern:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Original repository strict integer-only gate
        run: python3 -I -X utf8 scripts/no_float_gate.py .
      - name: Independently reconstruct 20 four-sphere frames and 24-cell recurrence
        run: |
          python3 -I -B tests/ym4_vol31_pattern_verify.py >/tmp/ym4-vol31-normal.hbp
          python3 -I -O tests/ym4_vol31_pattern_verify.py >/tmp/ym4-vol31-opt.hbp
          diff -u /tmp/ym4-vol31-normal.hbp /tmp/ym4-vol31-opt.hbp
          diff -u docs/certificate-atlas/YM4-VOL31-SPHERICAL-PATTERN-20261123.hbp /tmp/ym4-vol31-normal.hbp
          printf '%s  %s\n' '0ee5d1f9b13aa5ace62a7f289b9fed2a5f4acb0b0bd1d1e282b64cb58a066aa7' '/tmp/ym4-vol31-normal.hbp' | sha256sum -c -
      - name: Verify candidate atlas has the 24-cell note link
        run: |
          grep -q 'NOTE-YM4-VOL31-24CELL-PATTERN-20261123.md' docs/certificate-atlas/index.html
      - name: Archive exact 4D pattern receipt
        uses: actions/upload-artifact@v4
        with:
          name: ym4-vol31-24-cell-spherical-pattern
          path: /tmp/ym4-vol31-normal.hbp
