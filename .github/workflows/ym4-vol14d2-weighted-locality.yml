name: YM4 VOL14D2 weighted constrained locality
on:
  pull_request:
    paths:
      - 'tests/ym4_vol14d2_weighted_locality.py'
      - 'docs/certificate-atlas/*VOL14D2*'
      - '.github/workflows/ym4-vol14d2-weighted-locality.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-replay:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Exact stencil and weighted accretivity
        run: |
          set -euo pipefail
          mkdir -p build/ym4-vol14d2
          python3 -I -B tests/ym4_vol14d2_weighted_locality.py > build/ym4-vol14d2/receipt.hbp
          python3 -O -I -B tests/ym4_vol14d2_weighted_locality.py > build/ym4-vol14d2/replay.hbp
          cmp build/ym4-vol14d2/receipt.hbp build/ym4-vol14d2/replay.hbp
          cmp build/ym4-vol14d2/receipt.hbp docs/certificate-atlas/YM4-VOL14D2-WEIGHTED-LOCALITY-20261125.hbp
          cat build/ym4-vol14d2/receipt.hbp
      - name: No-float gate
        run: python3 -I -B scripts/no_float_gate.py .
