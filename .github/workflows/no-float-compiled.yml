# The operator's rule: "The gate must reject operations capable of silently introducing floating-point values." The source scan in no-float.yml reads text; this job reads what g++ produced.
# This repository's only compiled code is one C++ review file, so this is the small form, with its scope and limits in scripts/no_float_compiled.sh. A pass means these reads found nothing in what they read. Integer only, json=0.
name: No floating point, compiled level

on:
  workflow_dispatch:
  pull_request:
  merge_group:
  push:
    branches: [main, compiled-check-20261104]

permissions:
  contents: read

jobs:
  no-float-compiled:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Every C and C++ file compiled -O0 -S and read
        run: bash scripts/no_float_compiled.sh check
      - name: Planted floats go red, controls stay green
        run: bash scripts/no_float_compiled.sh plants
      - name: A tracked float goes red through the check itself
        run: |
          set -uo pipefail
          printf 'int main() { volatile double a = 1; return static_cast<int>(a / 3); }\n' > reviews/planted.cpp
          git add -f reviews/planted.cpp
          rc=0
          bash scripts/no_float_compiled.sh check > /tmp/planted.out || rc=$?
          cat /tmp/planted.out
          test "$rc" = 1
          grep -q '^COMPILED_CPP|file=reviews/planted.cpp|fp_ops=[1-9]' /tmp/planted.out
          git rm -q -f --cached reviews/planted.cpp
          rm -f reviews/planted.cpp
      - name: A tracked Rust file stops the small form
        run: |
          set -uo pipefail
          printf 'fn main() {}\n' > planted.rs
          git add -f planted.rs
          rc=0
          bash scripts/no_float_compiled.sh check > /tmp/planted-rs.out || rc=$?
          cat /tmp/planted-rs.out
          test "$rc" = 1
          grep -q 'rust_in_this_repository_needs_the_full_form' /tmp/planted-rs.out
          git rm -q -f --cached planted.rs
          rm -f planted.rs
