name: Docs integrity (control characters and relative links)
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  markdown-integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Planted-fault self-test
        run: python3 -I -B scripts/check_docs_integrity.py --selftest
      - name: Every tracked Markdown file
        run: python3 -I -B scripts/check_docs_integrity.py
