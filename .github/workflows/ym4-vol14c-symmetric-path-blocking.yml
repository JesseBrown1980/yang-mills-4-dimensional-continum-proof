name: YM4 VOL14C symmetric nonlinear path-average structure
on:
  pull_request:
    paths:
      - 'tests/ym4_su2_vol14c_symmetric_path_blocking.py'
      - 'docs/certificate-atlas/*VOL14C*'
      - '.github/workflows/ym4-vol14c-symmetric-path-blocking.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-replay:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Weighted paths and integer fixtures
        run: |
          set -euo pipefail
          mkdir -p build/ym4-vol14c
          python3 -I -B tests/ym4_su2_vol14c_symmetric_path_blocking.py > build/ym4-vol14c/receipt.hbp
          python3 -O -I -B tests/ym4_su2_vol14c_symmetric_path_blocking.py > build/ym4-vol14c/replay.hbp
          cmp build/ym4-vol14c/receipt.hbp build/ym4-vol14c/replay.hbp
          cmp build/ym4-vol14c/receipt.hbp docs/certificate-atlas/YM4-VOL14C-SYMMETRIC-PATH-BLOCKING-20261124.hbp
          cat build/ym4-vol14c/receipt.hbp
      - name: No-float gate
        run: python3 -I -B scripts/no_float_gate.py .
