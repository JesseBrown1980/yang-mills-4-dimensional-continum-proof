# YM4-02c: reflection positivity and the transfer operator of the finite 4D SU(2) Wilson lattice. Exact integer rows against the receipt, and each sabotage must exit 1 on a named check. json=0.
name: YM4-02c reflection positivity and transfer operator

on:
  workflow_dispatch:
  push:
    paths:
      - 'tests/test_reflection_transfer_4d.py'
      - 'tests/REFLECTION_TRANSFER_RECEIPT.txt'
      - 'docs/LEMMA-0004-REFLECTION-TRANSFER.md'
      - 'docs/PREDICTION-YM4-02c.hbp'
      - 'reviews/opus55-ym4-02c/**'
      - '.github/workflows/reflection-transfer.yml'
  pull_request:
    paths:
      - 'tests/test_reflection_transfer_4d.py'
      - 'tests/REFLECTION_TRANSFER_RECEIPT.txt'
      - 'docs/LEMMA-0004-REFLECTION-TRANSFER.md'
      - 'docs/PREDICTION-YM4-02c.hbp'
      - 'reviews/opus55-ym4-02c/**'
      - '.github/workflows/reflection-transfer.yml'

permissions:
  contents: read

jobs:
  reflection-transfer:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: The rows of the prediction as pushed stay byte for byte
        run: |
          set -euo pipefail
          got=$(head -n 26 docs/PREDICTION-YM4-02c.hbp | sha256sum | cut -d' ' -f1)
          test "$got" = 2448d8e6824b4f5197ee4d30aeb3612a7d5a8c3282e3737ddf5aeb5b5e6422d3
      - name: The rows through the second prediction stay byte for byte
        run: |
          set -euo pipefail
          got=$(head -n 93 docs/PREDICTION-YM4-02c.hbp | sha256sum | cut -d' ' -f1)
          test "$got" = 08db7d8135ba1ff945c79aefaafdc6661fa47c541561431de0e2ed73dcbe8210
      - name: The rows through the third prediction stay byte for byte
        run: |
          set -euo pipefail
          got=$(head -n 136 docs/PREDICTION-YM4-02c.hbp | sha256sum | cut -d' ' -f1)
          test "$got" = 6d21f7196c88c564dd937ec8ec5106253d90f54b340696d7661b872c9fc709f3
      - name: Every row against the recorded receipt
        run: |
          set -euo pipefail
          python3 -I -X utf8 tests/test_reflection_transfer_4d.py > /tmp/reflection.out
          cmp /tmp/reflection.out tests/REFLECTION_TRANSFER_RECEIPT.txt
          grep -q '^REFLECTION_TRANSFER_DONE|failed=0|json=0$' /tmp/reflection.out
          if grep -q '^FAILED' /tmp/reflection.out; then echo "a check failed"; exit 1; fi
      - name: Each sabotage exits 1 on the check that names it, with no crash
        run: |
          set -euo pipefail
          while read -r s named; do
            rc=0
            python3 -I -X utf8 tests/test_reflection_transfer_4d.py "sabotage=$s" > "/tmp/sab-$s.out" 2>&1 || rc=$?
            test "$rc" = 1
            grep -q "^FAILED|check=$named" "/tmp/sab-$s.out"
            if grep -q 'Traceback' "/tmp/sab-$s.out"; then echo "sabotage=$s crashed"; exit 1; fi
            echo "sabotage=$s exit=$rc $(grep -c '^FAILED' "/tmp/sab-$s.out") failed checks"
          done <<'NAMES'
          no_inverse_on_time_links reflection_
          wrong_plane reflection_
          wrong_multiplicity l_n_coefficients
          negative_weight_called_positive GRAM_LINK
          signed_site_weight_called_positive positive_site_weight_control
          bad_projector Tr(A_B_P)
          no_inverse_in_gram gauge-moved_site_Gram
          wrong_plane_in_gram gauge-moved_site_Gram
          dropped_inverse_third_letter plaquette_orientation
          dropped_inverse_fourth_letter plaquette_orientation
          every_function_one_plane every_function_on_L=
          t4_half_weights_dropped every_function_at_T=4
          NAMES
      - name: An unknown sabotage name is refused, rather than passing as red
        run: |
          set -euo pipefail
          rc=0
          python3 -I -X utf8 tests/test_reflection_transfer_4d.py sabotage=no_such_name > /tmp/unknown.out 2>&1 || rc=$?
          test "$rc" = 2
      - name: The second seat's files are the ones filed, and each delivered hash comes back
        working-directory: reviews/opus55-ym4-02c
        run: |
          set -euo pipefail
          sha256sum -c --quiet SHA256SUMS
          grep '^FILED|' FILED.hbp | while IFS='|' read -r _ p _ _ _ d c _; do
            p=${p#path=}; d=${d#sha256_as_delivered=}; c=${c#cr_removed=}
            if [ "$c" != 0 ]; then got=$(sed 's/$/\r/' "$p" | sha256sum | cut -d' ' -f1); else got=$(sha256sum "$p" | cut -d' ' -f1); fi
            test "$got" = "$d"
          done
          echo "delivered hashes all reproduced"
      - name: The second seat's recheck files are the ones filed, each delivered hash comes back, and each row of its list is filed or held
        working-directory: reviews/opus55-ym4-02c/recheck
        run: |
          set -euo pipefail
          test "$(sha256sum RECHECK_FILES.hbp | cut -d' ' -f1)" = "$(cat RECHECK_FILES.hbp.sha256)"
          grep '^FILED|' FILED.hbp | while IFS='|' read -r _ p _ _ _ d _ e _; do
            p=${p#path=}; d=${d#sha256_as_delivered=}; e=${e#cr_on=}
            case "$e" in
              none) got=$(sha256sum "$p" | cut -d' ' -f1) ;;
              every_line) got=$(sed 's/$/\r/' "$p" | sha256sum | cut -d' ' -f1) ;;
              last_line) got=$(sed '$ s/$/\r/' "$p" | sha256sum | cut -d' ' -f1) ;;
              *) echo "unknown cr_on: $e"; exit 1 ;;
            esac
            test "$got" = "$d"
          done
          grep '^RECHECK_FILE|' RECHECK_FILES.hbp | while IFS='|' read -r _ p _ h _; do
            grep -F "|$p|" FILED.hbp | grep -Fq "=${h#sha256=}|"
          done
          echo "delivered hashes all reproduced, and each row of its list is filed or held"
