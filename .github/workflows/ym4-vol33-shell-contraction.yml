name: YM4 VOL33 exact spherical Wilson two-point contraction and diagonal split
on:
  push:
    branches:
      - research/ym4-vol12-finite-packet-pilot-20261123
    paths:
      - tests/ym4_vol33_shell_pair_histogram.py
      - docs/certificate-atlas/YM4-VOL33-SHELL-CONTRACTION-20261124.hbp
      - .github/workflows/ym4-vol33-shell-contraction.yml
  pull_request:
    paths:
      - tests/ym4_vol33_shell_pair_histogram.py
      - docs/certificate-atlas/YM4-VOL33-SHELL-CONTRACTION-20261124.hbp
      - .github/workflows/ym4-vol33-shell-contraction.yml
  workflow_dispatch:

jobs:
  exact-spherical-two-point-contraction:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repository-wide strict integer-only gate
        run: python3 -I -X utf8 scripts/no_float_gate.py .
      - name: Independent 4D shell pair-histogram and connected two-point contraction
        run: |
          python3 -I -B tests/ym4_vol33_shell_pair_histogram.py >/tmp/ym4-vol33-normal.hbp
          python3 -I -O tests/ym4_vol33_shell_pair_histogram.py >/tmp/ym4-vol33-opt.hbp
          diff -u /tmp/ym4-vol33-normal.hbp /tmp/ym4-vol33-opt.hbp
          diff -u docs/certificate-atlas/YM4-VOL33-SHELL-CONTRACTION-20261124.hbp /tmp/ym4-vol33-normal.hbp
          printf '%s  %s\n' '78ccaccfab9936e74382b644c31373f173b33f7b5843f6d331641abb56868cdb' '/tmp/ym4-vol33-normal.hbp' | sha256sum -c -
      - name: Confirm candidate atlas links the exact separation certificate
        run: |
          grep -q 'NOTE-YM4-VOL33-CONNECTED-SU2-SPHERICAL-RECONSTRUCTION-20261124.md' docs/certificate-atlas/index.html
      - name: Archive strict connected/source separation receipt
        uses: actions/upload-artifact@v4
        with:
          name: ym4-vol33-spherical-two-point-contract
          path: /tmp/ym4-vol33-normal.hbp
