name: YM4 VOL26 original centered Wilson source and SU2 harmonic tail
on:
  push:
    branches:
      - research/ym4-vol12-finite-packet-pilot-20261123
    paths:
      - tests/ym4_vol26_centered_source_harmonic_tail.py
      - docs/certificate-atlas/YM4-VOL26-CENTERED-HARMONIC-TAIL-20261123.hbp
      - .github/workflows/ym4-vol26-centered-source-harmonic-tail.yml
  pull_request:
    paths:
      - tests/ym4_vol26_centered_source_harmonic_tail.py
      - docs/certificate-atlas/YM4-VOL26-CENTERED-HARMONIC-TAIL-20261123.hbp
      - .github/workflows/ym4-vol26-centered-source-harmonic-tail.yml
  workflow_dispatch:

jobs:
  native-centered-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Strict repository-wide no-float gate
        run: python3 -I -X utf8 scripts/no_float_gate.py .
      - name: Normal and optimized original 4D source and SU2 Haar harmonic checks
        run: |
          python3 -I -B tests/ym4_vol26_centered_source_harmonic_tail.py >/tmp/ym4-vol26-normal.hbp
          python3 -I -O tests/ym4_vol26_centered_source_harmonic_tail.py >/tmp/ym4-vol26-optimized.hbp
          diff -u /tmp/ym4-vol26-normal.hbp /tmp/ym4-vol26-optimized.hbp
          diff -u docs/certificate-atlas/YM4-VOL26-CENTERED-HARMONIC-TAIL-20261123.hbp /tmp/ym4-vol26-normal.hbp
          printf '%s  %s\n' 'ae6a5dfa5169401956e2c04a8936958cd9f24386dda9845a561c20d1f08f28f1' '/tmp/ym4-vol26-normal.hbp' | sha256sum -c -
      - name: Archive original native SU2 harmonic receipt
        uses: actions/upload-artifact@v4
        with:
          name: ym4-vol26-centered-source-harmonic
          path: /tmp/ym4-vol26-normal.hbp
