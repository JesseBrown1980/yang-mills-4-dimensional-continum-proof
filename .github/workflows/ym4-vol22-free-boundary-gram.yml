name: YM4 VOL22 SU2 free-boundary cut and source Dirichlet Gram
on:
  push:
    branches:
      - research/ym4-vol12-finite-packet-pilot-20261123
    paths:
      - tests/ym4_vol22_free_boundary_gram.py
      - docs/certificate-atlas/YM4-VOL22-FREE-BOUNDARY-GRAM-20261123.hbp
      - .github/workflows/ym4-vol22-free-boundary-gram.yml
  pull_request:
    paths:
      - tests/ym4_vol22_free_boundary_gram.py
      - docs/certificate-atlas/YM4-VOL22-FREE-BOUNDARY-GRAM-20261123.hbp
      - .github/workflows/ym4-vol22-free-boundary-gram.yml
  workflow_dispatch:

jobs:
  original-su2-shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Strict repository-wide integer-only source gate
        run: python3 -I -X utf8 scripts/no_float_gate.py .
      - name: Normal and optimized original four-dimensional geometry and Gram replay
        run: |
          python3 -I -B tests/ym4_vol22_free_boundary_gram.py >/tmp/ym4-vol22-normal.hbp
          python3 -I -O tests/ym4_vol22_free_boundary_gram.py >/tmp/ym4-vol22-opt.hbp
          diff -u /tmp/ym4-vol22-normal.hbp /tmp/ym4-vol22-opt.hbp
          diff -u docs/certificate-atlas/YM4-VOL22-FREE-BOUNDARY-GRAM-20261123.hbp /tmp/ym4-vol22-normal.hbp
          printf '%s  %s\n' 'f1698fd5d27c5ce9a1745871046f86887a69f4583d64b4ef769c7ec103b02089' '/tmp/ym4-vol22-normal.hbp' | sha256sum -c -
      - name: Archive original shell Gram receipt
        uses: actions/upload-artifact@v4
        with:
          name: ym4-vol22-original-shell-gram
          path: /tmp/ym4-vol22-normal.hbp
