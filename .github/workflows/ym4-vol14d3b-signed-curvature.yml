name: YM4 VOL14D3B signed curvature comparison
on:
  pull_request:
    paths:
      - 'tests/ym4_vol14d3b_signed_curvature.py'
      - 'docs/certificate-atlas/*VOL14D3B*'
      - '.github/workflows/ym4-vol14d3b-signed-curvature.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-replay:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Exact signed curvature reconstruction
        run: |
          set -euo pipefail
          mkdir -p build/ym4-vol14d3b
          python3 -I -B tests/ym4_vol14d3b_signed_curvature.py > build/ym4-vol14d3b/receipt.hbp
          python3 -O -I -B tests/ym4_vol14d3b_signed_curvature.py > build/ym4-vol14d3b/replay.hbp
          cmp build/ym4-vol14d3b/receipt.hbp build/ym4-vol14d3b/replay.hbp
          cmp build/ym4-vol14d3b/receipt.hbp docs/certificate-atlas/YM4-VOL14D3B-SIGNED-CURVATURE-20261126.hbp
          cat build/ym4-vol14d3b/receipt.hbp
      - name: No-float gate
        run: python3 -I -B scripts/no_float_gate.py .
