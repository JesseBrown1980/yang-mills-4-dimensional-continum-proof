name: YM4 VOL13 original SU2 rational flat toron and Wilson source scope
on:
  pull_request:
    paths:
      - 'tests/ym4_vol13_flat_rational_su2_toron.py'
      - 'docs/certificate-atlas/YM4-VOL13-RATIONAL-TORON-20261123.hbp'
      - 'docs/certificate-atlas/NOTE-YM4-VOL13-FLAT-SU2-TORON-20261123.md'
      - '.github/workflows/ym4-vol13-flat-toron.yml'
  push:
    paths:
      - 'tests/ym4_vol13_flat_rational_su2_toron.py'
      - 'docs/certificate-atlas/YM4-VOL13-RATIONAL-TORON-20261123.hbp'
      - 'docs/certificate-atlas/NOTE-YM4-VOL13-FLAT-SU2-TORON-20261123.md'
      - '.github/workflows/ym4-vol13-flat-toron.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-four-dimensional-rational-su2-toron:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Entire original L4 and L6 rational SU2 links, flat plaquettes, all good-star staples and winding
        run: |
          set -euo pipefail
          mkdir -p build/ym4-vol13-toron
          python3 -I -B tests/ym4_vol13_flat_rational_su2_toron.py > build/ym4-vol13-toron/TORON.hbp
          python3 -O -I -B tests/ym4_vol13_flat_rational_su2_toron.py > build/ym4-vol13-toron/REPLAY.hbp
          cmp build/ym4-vol13-toron/TORON.hbp build/ym4-vol13-toron/REPLAY.hbp
          cmp build/ym4-vol13-toron/TORON.hbp docs/certificate-atlas/YM4-VOL13-RATIONAL-TORON-20261123.hbp
          echo 'd75ad7420b73ad8c67422e9a7d473a8faef9e175d261e1a1646acdb961397b2b  build/ym4-vol13-toron/TORON.hbp' | sha256sum -c
          grep -Fq '|normalized_Polyakov_real=-527/625|' build/ym4-vol13-toron/TORON.hbp
          grep -Fq '|normalized_Polyakov_real=11753/15625|' build/ym4-vol13-toron/TORON.hbp
          grep -Fq '|11_continuum_gates=OPEN|' build/ym4-vol13-toron/TORON.hbp
      - name: No floating point gate
        run: python3 -I -B scripts/no_float_gate.py .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ym4-vol13-noncentral-rational-su2-torons
          path: build/ym4-vol13-toron/
          retention-days: 90
          if-no-files-found: warn
