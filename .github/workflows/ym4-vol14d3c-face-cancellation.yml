name: YM4 VOL14D3C paired face cancellation
on:
  pull_request:
    paths:
      - 'tests/ym4_vol14d3c_face_cancellation.py'
      - 'docs/certificate-atlas/*VOL14D3C*'
      - '.github/workflows/ym4-vol14d3c-face-cancellation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-replay:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Exact face geometry and multiplier witnesses
        run: |
          set -euo pipefail
          mkdir -p build/ym4-vol14d3c
          python3 -I -B tests/ym4_vol14d3c_face_cancellation.py > build/ym4-vol14d3c/receipt.hbp
          python3 -O -I -B tests/ym4_vol14d3c_face_cancellation.py > build/ym4-vol14d3c/replay.hbp
          cmp build/ym4-vol14d3c/receipt.hbp build/ym4-vol14d3c/replay.hbp
          cmp build/ym4-vol14d3c/receipt.hbp docs/certificate-atlas/YM4-VOL14D3C-FACE-CANCELLATION-20261126.hbp
          cat build/ym4-vol14d3c/receipt.hbp
      - name: No-float gate
        run: python3 -I -B scripts/no_float_gate.py .
