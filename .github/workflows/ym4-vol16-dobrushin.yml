name: YM4 VOL16 original SU2 unweighted strong-coupling boundary-decay control
on:
  pull_request:
    paths:
      - 'tests/ym4_vol16_dobrushin_control.py'
      - 'docs/certificate-atlas/NOTE-YM4-VOL16-UNWEIGHTED-DOBRUSHIN-20261123.md'
      - 'docs/certificate-atlas/YM4-VOL16-DOBRUSHIN-20261123.hbp'
      - '.github/workflows/ym4-vol16-dobrushin.yml'
  push:
    paths:
      - 'tests/ym4_vol16_dobrushin_control.py'
      - 'docs/certificate-atlas/NOTE-YM4-VOL16-UNWEIGHTED-DOBRUSHIN-20261123.md'
      - 'docs/certificate-atlas/YM4-VOL16-DOBRUSHIN-20261123.hbp'
      - '.github/workflows/ym4-vol16-dobrushin.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-original-4d-su2-interpolated-boundary-dobrushin:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Original 4D SU2 original-link neighborhood, centered buffer, beta thresholds and noncommuting staple falsifier
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/ym4-vol16
          python3 -I -B tests/ym4_vol16_dobrushin_control.py > build/ym4-vol16/CONTROL.hbp
          python3 -O -I -B tests/ym4_vol16_dobrushin_control.py > build/ym4-vol16/OPTIMIZED.hbp
          cmp build/ym4-vol16/CONTROL.hbp build/ym4-vol16/OPTIMIZED.hbp
          cmp build/ym4-vol16/CONTROL.hbp docs/certificate-atlas/YM4-VOL16-DOBRUSHIN-20261123.hbp
          echo '74fdab34edf1296968f48f7f26db381be1ffc6cb451d739c4d08a5bc6a027d85  build/ym4-vol16/CONTROL.hbp' | sha256sum -c
          grep -Fq '|degree_le18=PASS|' build/ym4-vol16/CONTROL.hbp
          grep -Fq '|uniform_exterior_unweighted_response_le_source_links_over6_times_2power_minus_graph_distance=ANALYTIC|' build/ym4-vol16/CONTROL.hbp
          grep -Fq '|production_beta_9power12=OUTSIDE_DOBRUSHIN_RANGE|' build/ym4-vol16/CONTROL.hbp
          grep -Fq '|high_beta_unweighted_decay=OPEN|' build/ym4-vol16/CONTROL.hbp
      - name: Strict no floating point source gate
        run: python3 -I -B scripts/no_float_gate.py .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ym4-vol16-original-SU2-dobrushin-unweighted
          path: build/ym4-vol16/
          retention-days: 90
          if-no-files-found: warn
