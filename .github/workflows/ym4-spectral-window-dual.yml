name: YM4 spectral-window dual and external certificate search

on:
  push:
    paths:
      - 'docs/certificate-atlas/**'
      - 'tests/test_ym4_certificate_spectral_window_dual.py'
      - '.github/workflows/ym4-spectral-window-dual.yml'
  pull_request:
    paths:
      - 'docs/certificate-atlas/**'
      - 'tests/test_ym4_certificate_spectral_window_dual.py'
      - '.github/workflows/ym4-spectral-window-dual.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-dual-window:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify prediction freeze before checker
        run: |
          set -euo pipefail
          test "$(git hash-object docs/certificate-atlas/PREDICT-SPECTRAL-WINDOW-DUAL-20261121.hbp)" = 'a8d582d2dcf5608b475800e76b2cce7e6d43cff0'
          grep -Fq '|phase=BEFORE_CHECKER|' docs/certificate-atlas/PREDICT-SPECTRAL-WINDOW-DUAL-20261121.hbp
          grep -Fq '|continuum_mass_gap=OPEN|' docs/certificate-atlas/PREDICT-SPECTRAL-WINDOW-DUAL-20261121.hbp
      - name: Strict no-floating-point source gate
        run: |
          set -euo pipefail
          python3 -I -X utf8 scripts/no_float_gate.py --selftest
          python3 -I -X utf8 scripts/no_float_gate.py .
      - name: Exact spectral dual positive-measure and HOLD controls
        run: |
          set -euo pipefail
          mkdir -p build/ym4_sw01
          python3 -I -B -X utf8 tests/test_ym4_certificate_spectral_window_dual.py | tee build/ym4_sw01/SPECTRAL-WINDOW-EXACT.hbp
          grep -Fq '|n2=HOLD|n4_window_lower=103_OVER_16384|' build/ym4_sw01/SPECTRAL-WINDOW-EXACT.hbp
          grep -Fq '|window_lower=53879_OVER_10240000|gate=PASS|' build/ym4_sw01/SPECTRAL-WINDOW-EXACT.hbp
          grep -Fq '|first_eigenstate_without_isolation=REJECTED|' build/ym4_sw01/SPECTRAL-WINDOW-EXACT.hbp
          grep -Fq '|actual_original_SU2_moment=OPEN|' build/ym4_sw01/SPECTRAL-WINDOW-EXACT.hbp
          grep -Fq '|continuum_mass_gap=OPEN|' build/ym4_sw01/SPECTRAL-WINDOW-EXACT.hbp
      - name: Byte-for-byte optimized replay receipt
        run: |
          set -euo pipefail
          python3 -O -I -B -X utf8 tests/test_ym4_certificate_spectral_window_dual.py > build/ym4_sw01/SPECTRAL-WINDOW-OPTIMIZED.hbp
          cmp build/ym4_sw01/SPECTRAL-WINDOW-EXACT.hbp build/ym4_sw01/SPECTRAL-WINDOW-OPTIMIZED.hbp
          sha256sum build/ym4_sw01/SPECTRAL-WINDOW-EXACT.hbp > build/ym4_sw01/SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ym4-spectral-window-dual-exact-receipts
          path: build/ym4_sw01/
          if-no-files-found: warn
