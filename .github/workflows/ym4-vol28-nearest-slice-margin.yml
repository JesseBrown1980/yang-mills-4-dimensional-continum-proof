name: YM4 VOL28 native SU2 nearest-slice Wilson numerical margin
on:
  push:
    branches:
      - research/ym4-vol12-finite-packet-pilot-20261123
    paths:
      - tests/ym4_vol28_nearest_slice_margin.py
      - docs/certificate-atlas/YM4-VOL28-NEAREST-SLICE-MARGIN-20261123.hbp
      - .github/workflows/ym4-vol28-nearest-slice-margin.yml
  pull_request:
    paths:
      - tests/ym4_vol28_nearest_slice_margin.py
      - docs/certificate-atlas/YM4-VOL28-NEAREST-SLICE-MARGIN-20261123.hbp
      - .github/workflows/ym4-vol28-nearest-slice-margin.yml
  workflow_dispatch:

jobs:
  nearest-slice-numeric-floor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Strict repository-wide no-float gate
        run: python3 -I -X utf8 scripts/no_float_gate.py .
      - name: Original Wilson geometry and integer production margin replay
        run: |
          python3 -I -B tests/ym4_vol28_nearest_slice_margin.py >/tmp/ym4-vol28-normal.hbp
          python3 -I -O tests/ym4_vol28_nearest_slice_margin.py >/tmp/ym4-vol28-optimized.hbp
          diff -u /tmp/ym4-vol28-normal.hbp /tmp/ym4-vol28-optimized.hbp
          diff -u docs/certificate-atlas/YM4-VOL28-NEAREST-SLICE-MARGIN-20261123.hbp /tmp/ym4-vol28-normal.hbp
          printf '%s  %s\n' 'e1f6fa7340b0a56436dcbd4aeed4cc744d7c30d8b3ad683432b8f91babcef6e2' '/tmp/ym4-vol28-normal.hbp' | sha256sum -c -
      - name: Archive production SU2 lower-margin receipt
        uses: actions/upload-artifact@v4
        with:
          name: ym4-vol28-native-su2-nearest-slice
          path: /tmp/ym4-vol28-normal.hbp
