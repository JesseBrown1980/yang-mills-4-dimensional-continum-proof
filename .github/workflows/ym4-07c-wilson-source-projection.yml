name: YM4-07C exact Wilson source/projection transfer bridge

on:
  push:
    paths:
      - 'tests/test_ym4_07c_wilson_projection_bridge.py'
      - 'tests/test_ym4_07c_su2_local_wilson_variance.py'
      - 'docs/NOTE-YM4-07C-WILSON-SOURCE-PROJECTION-BRIDGE-20261120.md'
      - '.github/workflows/ym4-07c-wilson-source-projection.yml'
  pull_request:
    paths:
      - 'tests/test_ym4_07c_wilson_projection_bridge.py'
      - 'tests/test_ym4_07c_su2_local_wilson_variance.py'
      - 'docs/NOTE-YM4-07C-WILSON-SOURCE-PROJECTION-BRIDGE-20261120.md'
      - '.github/workflows/ym4-07c-wilson-source-projection.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ym4-07c-exact-source-window-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Strict no-floating-point audit
        run: |
          set -euo pipefail
          python3 -I -X utf8 scripts/no_float_gate.py --selftest
          python3 -I -X utf8 scripts/no_float_gate.py .
      - name: Cryptographically pin original finite Wilson certificate source at accepted merge commit
        run: |
          set -euo pipefail
          mkdir -p build/ym4_07c
          curl -fLsS --retry 3 --connect-timeout 15 \
            'https://raw.githubusercontent.com/JesseBrown1980/Finite-universe-Yang-mills-existence-and-mass-gap-using-HEB-C/1f8fb0c72ef9f25d067bedee94e1cdbf6836583e/independent/y137-dual-cleanroom-20261120/final_accept.py' \
            -o build/ym4_07c/FINITE-PINNED-SOURCE.py
          test "$(git hash-object build/ym4_07c/FINITE-PINNED-SOURCE.py)" = \
            '6e5463a7912de49e336133a7faf151720a46ea2e'
          grep -Fq 'ppt==17074763' build/ym4_07c/FINITE-PINNED-SOURCE.py
          grep -Fq 'margin==9285530088' build/ym4_07c/FINITE-PINNED-SOURCE.py
          echo 'YM4_07C_FINITE_SOURCE_PIN|upstream_original_finite_Wilson=#350|git_blob_SHA1=6e5463a7912de49e336133a7faf151720a46ea2e|source=PINNED_ONLY|continuum_SU2=SEPARATE|json=0' \
            > build/ym4_07c/FINITE-SOURCE.hbp
      - name: Original finite Wilson amplitude tolerance and 4D full-gap adversarial check
        run: |
          set -euo pipefail
          mkdir -p build/ym4_07c
          python3 -I -B -X utf8 tests/test_ym4_07c_wilson_projection_bridge.py \
            | tee build/ym4_07c/EXACT-WILSON-SOURCE-BRIDGE.hbp
          grep -Fq '|original_finite_amplitude_lower_ppt=4132162024|' \
            build/ym4_07c/EXACT-WILSON-SOURCE-BRIDGE.hbp
          grep -Fq '|conditional_new_squared_weight_lower_numer=17466800587776576|' \
            build/ym4_07c/EXACT-WILSON-SOURCE-BRIDGE.hbp
          grep -Fq '|full_mass_gap_from_single_wilson=REJECTED|' \
            build/ym4_07c/EXACT-WILSON-SOURCE-BRIDGE.hbp
          grep -Fq '|uniform_gap_from_first_weight=REJECTED|' \
            build/ym4_07c/EXACT-WILSON-SOURCE-BRIDGE.hbp
          grep -Fq '|count=9|' build/ym4_07c/EXACT-WILSON-SOURCE-BRIDGE.hbp
          grep -Fq '|weak_coupling_all_scale_RG=OPEN|' \
            build/ym4_07c/EXACT-WILSON-SOURCE-BRIDGE.hbp
          grep -Fq '|physical_full_spectrum_mass_gap=OPEN|' \
            build/ym4_07c/EXACT-WILSON-SOURCE-BRIDGE.hbp
      - name: Genuine 4D continuous SU2 local Wilson variance and exact quaternion Haar control
        run: |
          set -euo pipefail
          python3 -I -B -X utf8 tests/test_ym4_07c_su2_local_wilson_variance.py \
            | tee build/ym4_07c/SU2-LOCAL-WILSON.hbp
          grep -Fq '|second_normalized_trace_moment=1_OVER_4|' \
            build/ym4_07c/SU2-LOCAL-WILSON.hbp
          grep -Fq '|variance_lower_numer=247|variance_lower_denom=1000|' \
            build/ym4_07c/SU2-LOCAL-WILSON.hbp
          grep -Fq '|variance_lower_numer=1|variance_lower_denom=32|' \
            build/ym4_07c/SU2-LOCAL-WILSON.hbp
          grep -Fq '|invalid_claims=9_REJECTED|' \
            build/ym4_07c/SU2-LOCAL-WILSON.hbp
          grep -Fq '|weak_coupling_uniform_gap=OPEN|' \
            build/ym4_07c/SU2-LOCAL-WILSON.hbp
      - name: Optimized and ordinary execution have identical source verdict
        run: |
          set -euo pipefail
          python3 -O -I -B -X utf8 tests/test_ym4_07c_wilson_projection_bridge.py \
            > build/ym4_07c/OPTIMIZED.hbp
          cmp build/ym4_07c/EXACT-WILSON-SOURCE-BRIDGE.hbp build/ym4_07c/OPTIMIZED.hbp
          python3 -O -I -B -X utf8 tests/test_ym4_07c_su2_local_wilson_variance.py \
            > build/ym4_07c/SU2-OPTIMIZED.hbp
          cmp build/ym4_07c/SU2-LOCAL-WILSON.hbp build/ym4_07c/SU2-OPTIMIZED.hbp
          sha256sum build/ym4_07c/EXACT-WILSON-SOURCE-BRIDGE.hbp \
            > build/ym4_07c/RECEIPT.sha256
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ym4-07c-exact-Wilson-source-projection-conditional-bridge
          path: build/ym4_07c/
          if-no-files-found: warn
