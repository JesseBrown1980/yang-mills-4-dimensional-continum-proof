name: YM4 VOL23 original SU2 four-source boundary Gram
on:
  push:
    branches:
      - research/ym4-vol12-finite-packet-pilot-20261123
    paths:
      - tests/ym4_vol23_native_su2_boundary_gram.py
      - docs/certificate-atlas/YM4-VOL23-NATIVE-SU2-FOUR-SOURCE-GRAM-20261123.hbp
      - .github/workflows/ym4-vol23-native-su2-boundary-gram.yml
  pull_request:
    paths:
      - tests/ym4_vol23_native_su2_boundary_gram.py
      - docs/certificate-atlas/YM4-VOL23-NATIVE-SU2-FOUR-SOURCE-GRAM-20261123.hbp
      - .github/workflows/ym4-vol23-native-su2-boundary-gram.yml
  workflow_dispatch:

jobs:
  original-four-source-gram:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repository-wide strict integer-only gate
        run: python3 -I -X utf8 scripts/no_float_gate.py .
      - name: Original four-dimensional noncommuting/Haar-moment replay
        run: |
          python3 -I -B tests/ym4_vol23_native_su2_boundary_gram.py >/tmp/ym4-vol23-normal.hbp
          python3 -I -O tests/ym4_vol23_native_su2_boundary_gram.py >/tmp/ym4-vol23-opt.hbp
          diff -u /tmp/ym4-vol23-normal.hbp /tmp/ym4-vol23-opt.hbp
          diff -u docs/certificate-atlas/YM4-VOL23-NATIVE-SU2-FOUR-SOURCE-GRAM-20261123.hbp /tmp/ym4-vol23-normal.hbp
          printf '%s  %s\n' 'fa5b0898227f3ff90e174c2d4017185b002094393961d1e1aacfb8e87b87d16b' '/tmp/ym4-vol23-normal.hbp' | sha256sum -c -
      - name: Archive original SU2 rational receipt
        uses: actions/upload-artifact@v4
        with:
          name: ym4-vol23-original-su2-four-gram
          path: /tmp/ym4-vol23-normal.hbp
