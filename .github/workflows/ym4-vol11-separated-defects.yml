name: YM4 VOL11 original SU2 separated Wilson plaquette joint and Haar tail
on:
  pull_request:
    paths:
      - 'tests/ym4_su2_vol11_separated_defects.py'
      - 'docs/certificate-atlas/NOTE-YM4-VOL11-SEPARATED-DEFECTS-20261122.md'
      - 'docs/certificate-atlas/YM4-VOL11-SEPARATED-DEFECTS-20261122.hbp'
      - '.github/workflows/ym4-vol11-separated-defects.yml'
  push:
    paths:
      - 'tests/ym4_su2_vol11_separated_defects.py'
      - 'docs/certificate-atlas/NOTE-YM4-VOL11-SEPARATED-DEFECTS-20261122.md'
      - 'docs/certificate-atlas/YM4-VOL11-SEPARATED-DEFECTS-20261122.hbp'
      - '.github/workflows/ym4-vol11-separated-defects.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-original-SU2-Haar-separated-plaquettes:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Independent normal and optimized original SU2 incidence and rational replay
        run: |
          set -euo pipefail
          mkdir -p build/ym4-vol11
          python3 -I -B tests/ym4_su2_vol11_separated_defects.py > build/ym4-vol11/SEPARATED-DEFECTS.hbp
          python3 -O -I -B tests/ym4_su2_vol11_separated_defects.py > build/ym4-vol11/REPLAY.hbp
          cmp build/ym4-vol11/SEPARATED-DEFECTS.hbp build/ym4-vol11/REPLAY.hbp
          cmp build/ym4-vol11/SEPARATED-DEFECTS.hbp docs/certificate-atlas/YM4-VOL11-SEPARATED-DEFECTS-20261122.hbp
          echo '4bc334bb4c478d8d35418d9d2a5c231e77473b59fa4675b57ed66afef36984aa  build/ym4-vol11/SEPARATED-DEFECTS.hbp' | sha256sum -c
          grep -Fq '|conditional_defect_probability_lt=1/1000000|' build/ym4-vol11/SEPARATED-DEFECTS.hbp
          grep -Fq '|selected_links_share_no_original_plaquette=PASS|' build/ym4-vol11/SEPARATED-DEFECTS.hbp
          grep -Fq '|periodic_pstar_le=12R_over_epsilon|' build/ym4-vol11/SEPARATED-DEFECTS.hbp
          grep -Fq '|pstar_le=11456/43046721|' build/ym4-vol11/SEPARATED-DEFECTS.hbp
          grep -Fq '|joint_original_bad_star_rho=OPEN|' build/ym4-vol11/SEPARATED-DEFECTS.hbp
          grep -Fq '|physical_size_cube=OPEN|' build/ym4-vol11/SEPARATED-DEFECTS.hbp
          grep -Fq '|11_continuum_gates=OPEN|' build/ym4-vol11/SEPARATED-DEFECTS.hbp
      - name: Strict integer/no-floating-point policy
        run: |
          set -euo pipefail
          python3 -I -B scripts/no_float_gate.py .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ym4-vol11-original-SU2-separated-plaquette-tail
          path: build/ym4-vol11/
          retention-days: 90
          if-no-files-found: warn
