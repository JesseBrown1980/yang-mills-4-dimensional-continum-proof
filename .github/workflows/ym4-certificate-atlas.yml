name: YM4 certificate atlas and external exact-rational cross-check

on:
  push:
    paths:
      - 'docs/certificate-atlas/**'
      - 'tests/test_ym4_certificate_atlas.py'
      - '.github/workflows/ym4-certificate-atlas.yml'
  pull_request:
    paths:
      - 'docs/certificate-atlas/**'
      - 'tests/test_ym4_certificate_atlas.py'
      - '.github/workflows/ym4-certificate-atlas.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  atlas-source-and-falsifiers:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Strict existing no-floating-point source gate
        run: |
          set -euo pipefail
          python3 -I -X utf8 scripts/no_float_gate.py --selftest
          python3 -I -X utf8 scripts/no_float_gate.py .
      - name: Verify 92 source nodes, WG09/VOL01 links, 11 open gates, external exact constants
        run: |
          set -euo pipefail
          mkdir -p build/ym4_atlas
          python3 -I -B -X utf8 tests/test_ym4_certificate_atlas.py | tee build/ym4_atlas/ATLAS-VERIFICATION.hbp
          grep -Fq '|nodes=92|open_gates=11|external_leads=22|' build/ym4_atlas/ATLAS-VERIFICATION.hbp
          grep -Fq '|graph_modes=4|camera_positions=3|script_free=YES|' build/ym4_atlas/ATLAS-VERIFICATION.hbp
          grep -Fq '|negative_controls=6_REJECTED|' build/ym4_atlas/ATLAS-VERIFICATION.hbp
          grep -Fq '|finite_constants=PASS|' build/ym4_atlas/ATLAS-VERIFICATION.hbp
          grep -Fq '|quaternion_and_traces=PASS|' build/ym4_atlas/ATLAS-VERIFICATION.hbp
          grep -Fq '|SU2_loop_identity=PASS|' build/ym4_atlas/ATLAS-VERIFICATION.hbp
          grep -Fq '|continuous_SU2_mass_gap=OPEN|' build/ym4_atlas/ATLAS-VERIFICATION.hbp
      - name: Optimized integer replay is byte identical
        run: |
          set -euo pipefail
          python3 -O -I -B -X utf8 tests/test_ym4_certificate_atlas.py > build/ym4_atlas/ATLAS-OPTIMIZED.hbp
          cmp build/ym4_atlas/ATLAS-VERIFICATION.hbp build/ym4_atlas/ATLAS-OPTIMIZED.hbp
          sha256sum build/ym4_atlas/ATLAS-VERIFICATION.hbp > build/ym4_atlas/SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ym4-certificate-atlas-source-integrity
          path: build/ym4_atlas/
          if-no-files-found: warn
