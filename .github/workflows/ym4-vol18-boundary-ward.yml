name: YM4 VOL18 original SU2 Wilson boundary Ward gauge projection
on:
  pull_request:
    paths:
      - 'tests/ym4_vol18_boundary_ward.py'
      - 'docs/certificate-atlas/NOTE-YM4-VOL18-BOUNDARY-WARD-PROJECTION-20261123.md'
      - 'docs/certificate-atlas/YM4-VOL18-BOUNDARY-WARD-20261123.hbp'
      - '.github/workflows/ym4-vol18-boundary-ward.yml'
  push:
    paths:
      - 'tests/ym4_vol18_boundary_ward.py'
      - 'docs/certificate-atlas/NOTE-YM4-VOL18-BOUNDARY-WARD-PROJECTION-20261123.md'
      - 'docs/certificate-atlas/YM4-VOL18-BOUNDARY-WARD-20261123.hbp'
      - '.github/workflows/ym4-vol18-boundary-ward.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-SU2-Wilson-gauge-orbit-boundary-projection:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Original SU2 L6/L10 cyclic boundary staples and full cubic gauge Ward exact fixtures
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/ym4-vol18
          python3 -I -B tests/ym4_vol18_boundary_ward.py > build/ym4-vol18/WARD.hbp
          python3 -O -I -B tests/ym4_vol18_boundary_ward.py > build/ym4-vol18/OPTIMIZED.hbp
          cmp build/ym4-vol18/WARD.hbp build/ym4-vol18/OPTIMIZED.hbp
          cmp build/ym4-vol18/WARD.hbp docs/certificate-atlas/YM4-VOL18-BOUNDARY-WARD-20261123.hbp
          echo '6ecd72172e1d018022a5f94c1f04fc7223b6c4a509ad5232ed0201e04cef065d  build/ym4-vol18/WARD.hbp' | sha256sum -c
          grep -Fq '|B_e_transforms_as_SU2_bifundamental_vector=PASS|' build/ym4-vol18/WARD.hbp
          grep -Fq '|one_common_site_gauge_aligns_exactly=PASS|' build/ym4-vol18/WARD.hbp
          grep -Fq '|boundary_resultant_Ward_variation_pointwise_zero=PASS|' build/ym4-vol18/WARD.hbp
          grep -Fq '|high_beta_projected_boundary_distance_distribution=OPEN|' build/ym4-vol18/WARD.hbp
      - name: Strict no floating point source gate
        run: python3 -I -B scripts/no_float_gate.py .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ym4-vol18-original-SU2-Ward-projector
          path: build/ym4-vol18/
          retention-days: 90
          if-no-files-found: warn
